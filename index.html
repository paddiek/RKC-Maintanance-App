<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#12635B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
    <div class="app-container">
        <header>
            <h1> RKC Student Support</h1>
            <p>Report maintenance issues below</p>
        </header>

        <form id="rkcForm" action="https://formspree.io/f/xdaaykyr" method="POST">
            <div class="form-group">
                <label for="studentName">Full Name</label>
                <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="location">Room Number</label>
                <input type="text" id="location" name="location" placeholder="e.g. Room 204" required>
            </div>

            <div class="form-group">
                <label for="residence">Residence:</label>
                <select name="residence" id="residence" required>
                    <option value="" disabled selected>Select Residence...</option> 
                    <option value="clark">Clark House</option>
                    <option value="norwich">Norwich</option>
                    <option value="nbs">NBS</option>
                    <option value="langham">Langham</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number </label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. 081 234 5678" required>    
            </div>

            <div class="form-group">
                <label for="issueType">Issue Category</label>
                <select id="issueType" name="issueType" required>
                    <option value="">Select Category...</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Furniture">Furniture/Fixing</option>
                    <option value="Other">Other</option>
                </select>
            </div>
                
            
            <input type="hidden" name="_cc" value="enzokuhlemabuya@gmail.com"/>
            <div class="form-group">
                <label for="details">Description</label>
                <textarea id="details" name="details" rows="4" placeholder="What needs fixing?" required></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Report</button>
        </form>

        <div id="successMessage" class="hidden">
            <div class="icon">✅</div>
            <h2>Report Received</h2>
            <div class="ticket-box">
                <span>Your Reference ID:</span>
                <strong id="ticketIdDisplay">#RKC-0000</strong>
            </div>
            <p>Maintenance has been notified.Redirecting to Whatsapp</p>
            <button onclick="location.reload()">Send Another</button>
        </div>
        
        <hr style="margin: 25px 0; border: none; border-top: 1px solid #e0e0e0;">

        <div class="status-card" style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center;">
            <h3 style="margin-top: 0; color: #12635B;">Track Existing Ticket</h3>
            <p style="font-size: 0.9rem; color: #555;">Already logged an issue? Check status with your manager.</p>
            
            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
                <input type="text" id="trackTicketId" placeholder="e.g. #RKC-5631" style="padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 60%;">
                <button type="button" id="trackBtn" style="padding: 8px 15px; background: #12635B; color: white; border: none; border-radius: 5px; cursor: pointer;">Track</button>
            </div>
        </div>
    </div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('rkcForm');
    
    if (form) {
      form.addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        btn.innerText = "Sending..."; 
        const randomDigits = Math.floor(1000 + Math.random() * 9000);
        const ticketID ="#RKC-" + randomDigits;
        const name = document.getElementById('studentName').value; 
        const room = document.getElementById('location').value;
        const res = document.getElementById('residence').value;
        const category = document.getElementById('issueType').value;
        const desc = document.getElementById('details').value;

        let whatsappNum;
        if (res === "clark") {
            whatsappNum = "27838463813"; 
        } else if (res === "norwich") {
            whatsappNum = "27838463813"; 
        } else if (res === "nbs") {
            whatsappNum = "27698940775"; 
        } else if (res === "langham") {
            whatsappNum = "27605774617"; 
        } else {
            whatsappNum = "27620195994"; 
        } 
              

   // 1. Build WhatsApp message text
        const whatsappMessage = `🚨 *NEW MAINTENANCE TICKET* 🚨\n\n` +
                                `🎫 *Ticket ID:* ${ticketID}\n` +
                                `👤 *Name:* ${name}\n` +
                                `🏢 *Residence:* ${res}\n` +
                                `🚪 *Room:* ${room}\n` +
                                `📝 *Issue:* ${desc}\n\n` +
                                `Please click the 📎 icon to send a photo if needed.`;

        // 2. Append Ticket ID to Formspree
        const formData = new FormData(form);
        formData.append('Ticket_ID', ticketID);

        try {
            // Send to Formspree in background
            await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });

            // Update UI on screen (Ensure <strong id="ticketIdDisplay"> exists in HTML!)
            const ticketDisplay = document.getElementById('ticketIdDisplay');
            if (ticketDisplay) {
                ticketDisplay.innerText = ticketID;
            }

            document.getElementById('rkcForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');

            // 3. Redirect to WhatsApp (using whatsappMessage & encodeURIComponent)
            const waUrl = `https://wa.me/${whatsappNum}?text=${encodeURIComponent(whatsappMessage)}`;
            window.location.href = waUrl;

        } catch (error) {
            alert("Submission failed. Check your connection.");
            btn.innerText = originalText;
        }
      });
        // ⬇️ PASTE RIGHT HERE (Inside DOMContentLoaded, after submit listener) ⬇️
      const trackBtn = document.getElementById('trackBtn');
      if (trackBtn) {
          trackBtn.addEventListener('click', function() {
              const trackId = document.getElementById('trackTicketId').value.trim();
              const selectedRes = document.getElementById('residence').value;

              if (!trackId) {
                  alert("Please enter your Ticket ID (e.g. #RKC-5631)");
                  return;
              }

              let managerPhone = "27620195994";
              if (selectedRes === "clark" || selectedRes === "norwich") managerPhone = "27838463813";
              if (selectedRes === "nbs") managerPhone = "27698940775";
              if (selectedRes === "langham") managerPhone = "27605774617";

              const followUpMessage = `Hi! I am following up on the status of my maintenance ticket *${trackId}*. Could you please provide an update?`;
              window.location.href = `https://wa.me/${managerPhone}?text=${encodeURIComponent(followUpMessage)}`;
          });
      }
    }
  });
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
