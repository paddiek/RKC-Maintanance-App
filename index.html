<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#12635B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
    <div class="app-container">
        <header>
            <h1> RKC Student Support</h1>
            <p>Report maintenance issues below</p>
        </header>

        <form id="rkcForm" action="https://formspree.io/f/xdaaykyr" method="POST">
            <div class="form-group">
                <label for="studentName">Full Name</label>
                <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="location">Room Number</label>
                <input type="text" id="location" name="location" placeholder="e.g. Room 204" required>
            </div>

            <div class="form-group">
                <label for="residence">Residence:</label>
                <select name="residence" id="residence" required>
                    <option value="" disabled selected>Select Residence...</option> 
                    <option value="clark">Clark House</option>
                    <option value="norwich">Norwich</option>
                    <option value="nbs">NBS</option>
                    <option value="langham">Langham</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number </label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. 081 234 5678" required>    
            </div>

            <div class="form-group">
                <label for="issueType">Issue Category</label>
                <select id="issueType" name="issueType" required>
                    <option value="">Select Category...</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Furniture">Furniture/Fixing</option>
                    <option value="Other">Other</option>
                </select>
            </div>
                
            <!-- REMOVED _next to prevent the Formspree "Thanks" page from blocking WhatsApp -->
            <input type="hidden" name="_cc" value="moyomartin462@gmail.com"/>

            <div class="form-group">
                <label for="details">Description</label>
                <textarea id="details" name="details" rows="4" placeholder="What needs fixing?" required></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Report</button>
        </form>

        <div id="successMessage" class="hidden">
            <div class="icon">✅</div>
            <h2>Report Received</h2>
            <p>Maintenance has been notified.</p>
            <button onclick="location.reload()">Send Another</button>
        </div>
    </div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('rkcForm');
    
    if (form) {
      form.addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        btn.innerText = "Sending..."; 

        const name = document.getElementById('studentName').value; 
        const room = document.getElementById('location').value;
        const res = document.getElementById('residence').value;
        const category = document.getElementById('issueType').value;
        const desc = document.getElementById('details').value;

        let whatsappNum;
        if (res === "clark") {
            whatsappNum = "27623591611"; 
        } else if (res === "norwich") {
            whatsappNum = "27623591611"; 
        } else if (res === "nbs") {
            whatsappNum = "27698940775"; 
        } else if (res === "langham") {
            whatsappNum = "27605774617"; 
        } else {
            whatsappNum = "27620195994"; 
        } 

        const formData = new FormData(form);
        try {
          // Send to Formspree in the background
          await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
          });

          // Create the WhatsApp message with instructions
          const message = `*RKC MAINTENANCE REPORT*%0A` +
                          `*From:* ${name}%0A` +
                          `*Room:* ${room}%0A` +
                          `*Res:* ${res}%0A` +
                          `*Issue:* ${desc}%0A%0A` +
                          `*--- NEXT STEP ---*%0A` +
                          `Please click the 📎 or 📷 icon to *send a photo* of the issue now.`;

          // Redirect to WhatsApp
          window.location.href = `https://wa.me/${whatsappNum}?text=${message}`;
          
        } catch (error) {
          alert("Submission failed. Check your connection.");
          btn.innerText = originalText;
        }
      });
    }
  });
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
